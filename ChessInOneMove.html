<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess In One Move</title><meta name="theme-color" content="#161512">
<!-- Chess In One Move. GPL-3.0-or-later. Uses chessground (GPL-3.0+), chess.js (BSD-2), Lichess puzzle data (CC0), piece sets: see README. -->
<style>.cg-wrap {
  box-sizing: content-box;
  position: relative;
  display: block;
}

cg-container {
  position: absolute;
  width: 100%;
  height: 100%;
  display: block;
  top: 0;
}

cg-board {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  line-height: 0;
  background-size: cover;
}

.cg-wrap.manipulable cg-board {
  cursor: pointer;
}

cg-board square {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  pointer-events: none;
}

cg-board square.move-dest {
  pointer-events: auto;
}

cg-board square.last-move {
  will-change: transform;
}

.cg-wrap piece {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  background-size: cover;
  z-index: 2;
  will-change: transform;
  pointer-events: none;
}

cg-board piece.dragging {
  cursor: move;
  /* !important to override z-index from 3D piece inline style */
  z-index: 11 !important;
}

piece.anim {
  z-index: 8;
}

piece.fading {
  z-index: 1;
  opacity: 0.5;
}

.cg-wrap piece.ghost {
  opacity: 0.3;
}

.cg-wrap piece svg {
  overflow: hidden;
  position: relative;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.6;
}

.cg-wrap cg-auto-pieces,
.cg-wrap .cg-shapes,
.cg-wrap .cg-custom-svgs {
  overflow: visible;
  position: absolute;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.cg-wrap cg-auto-pieces {
  z-index: 2;
}

.cg-wrap cg-auto-pieces piece {
  opacity: 0.3;
}

.cg-wrap .cg-shapes {
  overflow: hidden;
  opacity: 0.6;
  z-index: 2;
}

.cg-wrap .cg-custom-svgs {
  /* over piece.anim = 8, but under piece.dragging = 11 */
  z-index: 9;
}

.cg-wrap .cg-custom-svgs svg {
  overflow: visible;
}

.cg-wrap coords {
  position: absolute;
  display: flex;
  pointer-events: none;
  opacity: 0.8;
  font-family: sans-serif;
  font-size: 9px;
}

.cg-wrap coords.ranks {
  left: 4px;
  top: -20px;
  flex-flow: column-reverse;
  height: 100%;
  width: 12px;
}

.cg-wrap coords.ranks.black {
  flex-flow: column;
}

.cg-wrap coords.ranks.left {
  left: -15px;
  align-items: flex-end;
}

.cg-wrap coords.files {
  bottom: -4px;
  left: 24px;
  flex-flow: row;
  width: 100%;
  height: 16px;
  text-transform: uppercase;
  text-align: center;
}

.cg-wrap coords.files.black {
  flex-flow: row-reverse;
}

.cg-wrap coords coord {
  flex: 1 1 auto;
}

.cg-wrap coords.ranks coord {
  transform: translateY(39%);
}

.cg-wrap coords.squares {
  bottom: 0;
  left: 0;
  text-transform: uppercase;
  text-align: right;
  flex-flow: column-reverse;
  height: 100%;
  width: 12.5%;
}

.cg-wrap coords.squares.black {
  flex-flow: column;
}

.cg-wrap coords.squares.left {
  text-align: left;
}

.cg-wrap coords.squares coord {
  padding: 6% 4%;
}

.cg-wrap coords.squares.rank2 {
  transform: translateX(100%);
}

.cg-wrap coords.squares.rank3 {
  transform: translateX(200%);
}

.cg-wrap coords.squares.rank4 {
  transform: translateX(300%);
}

.cg-wrap coords.squares.rank5 {
  transform: translateX(400%);
}

.cg-wrap coords.squares.rank6 {
  transform: translateX(500%);
}

.cg-wrap coords.squares.rank7 {
  transform: translateX(600%);
}

.cg-wrap coords.squares.rank8 {
  transform: translateX(700%);
}

:root{--bg:#161512;--panel:#262421;--text:#e8e6e1;--muted:#a09d96;--accent:#d9a441;--good:#7fc47a;--bad:#e5645a;--info:#6fb1e8}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#2a2823,var(--bg));color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{padding:12px 16px 32px}
.app{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:6px 0;font-size:1.6rem;letter-spacing:.5px}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem}
.boardwrap{width:100%;max-width:min(80vh,640px);aspect-ratio:1;margin:0 auto;position:relative;border-radius:6px;box-shadow:0 10px 40px #000a;overflow:hidden}
#board{width:100%;height:100%}
.panel{background:var(--panel);border-radius:10px;padding:14px;box-shadow:0 4px 16px #0006}
.turn{font-size:1.25rem;font-weight:700}.tag{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.msg{min-height:3.2em;margin:10px 0;padding:10px;border-radius:8px;background:#1b1a18;color:var(--muted)}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}.msg.info{color:var(--info)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#3a3834;color:var(--text)}
button:hover{background:#4a4742}button.primary{background:var(--accent);color:#1a1307;font-weight:700}button.primary:hover{background:#e8b552}
button[hidden]{display:none}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row label{flex:0 0 70px;color:var(--muted);font-size:.85rem}
select{flex:1;font:inherit;padding:7px;border-radius:8px;border:0;background:#1b1a18;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats div{background:#1b1a18;border-radius:8px;padding:8px}.stats b{display:block;font-size:1.3rem;color:var(--accent)}.stats span{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.foot{font-size:.75rem;color:var(--muted);margin-top:12px}.foot a{color:var(--muted)}
body.won .boardwrap{box-shadow:0 0 0 3px var(--good),0 10px 40px #000a}
body.lost .boardwrap{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#promo{position:absolute;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;gap:10px}
#promo[hidden]{display:none}
.promo-btn{width:22%;aspect-ratio:1;padding:0;background:#f0e9dc;position:relative}
.promo-btn piece{position:absolute;inset:0;background-size:cover;display:block}
@media (max-width:760px){.app{grid-template-columns:1fr}.boardwrap{max-width:100%}}
/* board themes */
.theme-brown cg-board{background-color:#b58863;background-image:conic-gradient(#f0d9b5 25%,#b58863 0 50%,#f0d9b5 0 75%,#b58863 0);background-size:25% 25%}
.theme-green cg-board{background-color:#769656;background-image:conic-gradient(#eeeed2 25%,#769656 0 50%,#eeeed2 0 75%,#769656 0);background-size:25% 25%}
.theme-blue cg-board{background-color:#6e8fb1;background-image:conic-gradient(#dee3e6 25%,#6e8fb1 0 50%,#dee3e6 0 75%,#6e8fb1 0);background-size:25% 25%}
.theme-slate cg-board{background-color:#566170;background-image:conic-gradient(#b7c0cc 25%,#566170 0 50%,#b7c0cc 0 75%,#566170 0);background-size:25% 25%}
.theme-rose cg-board{background-color:#b4707e;background-image:conic-gradient(#f3dfe2 25%,#b4707e 0 50%,#f3dfe2 0 75%,#b4707e 0);background-size:25% 25%}
cg-board square.last-move{background-color:rgba(255,210,60,.45)}
cg-board square.check{background:radial-gradient(ellipse at center,rgba(255,0,0,1) 0%,rgba(231,0,0,1) 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}
</style></head><body>
